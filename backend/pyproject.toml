[project]
name = "backend"
version = "0.1.0"
description = "SymComp Website backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "pwdlib[argon2]>=0.2.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "sqlalchemy>=2.0.51",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "pytest-asyncio>=1.4.0",
]